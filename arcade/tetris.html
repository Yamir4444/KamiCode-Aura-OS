<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Cyber-Purple | Yamir Vera</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#070014; color:#c084fc; font-family:'Courier New', monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
    h1 { font-size: 1.1rem; color: #a855f7; margin-bottom: 6px; letter-spacing: 2px; }
    canvas { background:#020005; border:2px solid #a855f7; border-radius:10px; box-shadow:0 0 25px rgba(168,85,247,0.35); }
    .hud { display:flex; gap:16px; margin-top:10px; font-size:0.85rem; font-weight:bold; }
    .hud span { color:#00f0ff; }
    .ctrls { display:flex; gap:8px; margin-top:10px; }
    .btn { background:#1e0b3d; border:1px solid #a855f7; color:#f3e8ff; padding:8px 14px; border-radius:8px; font-size:0.85rem; font-weight:bold; cursor:pointer; }
    .btn:active { background:#9333ea; }
  </style>
</head>
<body>
  <h1>👾 TETRIS CYBER-PURPLE</h1>
  <canvas id="c" width="220" height="420"></canvas>
  <div class="hud">PUNTOS: <span id="s">0</span> | LÍNEAS: <span id="l">0</span></div>
  <div class="ctrls">
    <button class="btn" id="l-btn">⬅️</button>
    <button class="btn" id="r-btn" style="background:#581c87; border-color:#d8b4fe;">🔄 Girar</button>
    <button class="btn" id="rg-btn">➡️</button>
    <button class="btn" id="d-btn">⬇️</button>
  </div>
  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d'); ctx.scale(22, 21);
    const arena = Array.from({length:20},()=>new Array(10).fill(0));
    const colors = [null,'#a855f7','#06b6d4','#ec4899','#f59e0b','#10b981','#3b82f6'];
    const p = {pos:{x:0,y:0},matrix:null,score:0,lines:0};
    function createPiece(t){
      if(t==='T')return[[0,1,0],[1,1,1],[0,0,0]];
      if(t==='O')return[[2,2],[2,2]];
      if(t==='L')return[[0,0,3],[3,3,3],[0,0,0]];
      if(t==='I')return[[0,4,0,0],[0,4,0,0],[0,4,0,0],[0,4,0,0]];
      return[[5,5,0],[0,5,5],[0,0,0]];
    }
    function draw(){
      ctx.fillStyle='#020005'; ctx.fillRect(0,0,c.width,c.height);
      arena.forEach((r,y)=>r.forEach((v,x)=>{if(v){ctx.fillStyle=colors[v];ctx.fillRect(x,y,1,1);}}));
      if(p.matrix) p.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v){ctx.fillStyle=colors[v];ctx.fillRect(x+p.pos.x,y+p.pos.y,1,1);}}));
    }
    function collide(a,p){
      const[m,o]=[p.matrix,p.pos];
      for(let y=0;y<m.length;++y)for(let x=0;x<m[y].length;++x)if(m[y][x]!==0&&(a[y+o.y]&&a[y+o.y][x+o.x])!==0)return true;
      return false;
    }
    function merge(a,p){p.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v)a[y+p.pos.y][x+p.pos.x]=v;}));}
    function sweep(){
      outer:for(let y=arena.length-1;y>0;--y){
        for(let x=0;x<arena[y].length;++x)if(arena[y][x]===0)continue outer;
        arena.unshift(arena.splice(y,1)[0].fill(0)); ++y; p.score+=100; p.lines++;
      }
      document.getElementById('s').innerText=p.score; document.getElementById('l').innerText=p.lines;
    }
    function drop(){
      p.pos.y++; if(collide(arena,p)){p.pos.y--;merge(arena,p);reset();sweep();} dropCount=0;
    }
    function move(d){ p.pos.x+=d; if(collide(arena,p)) p.pos.x-=d; }
    function rot(){
      for(let y=0;y<p.matrix.length;++y)for(let x=0;x<y;++x)[p.matrix[x][y],p.matrix[y][x]]=[p.matrix[y][x],p.matrix[x][y]];
      p.matrix.forEach(r=>r.reverse());
      if(collide(arena,p)) p.matrix.reverse();
    }
    function reset(){
      p.matrix=createPiece('TOLIZ'[Math.random()*5|0]); p.pos.y=0; p.pos.x=3;
      if(collide(arena,p)){arena.forEach(r=>r.fill(0));p.score=0;p.lines=0;}
    }
    let dropCount=0, last=0;
    function update(t=0){
      dropCount+=t-last; last=t;
      if(dropCount>650) drop();
      draw(); requestAnimationFrame(update);
    }
    document.addEventListener('keydown',e=>{
      if(e.keyCode===37)move(-1);if(e.keyCode===39)move(1);if(e.keyCode===40)drop();if(e.keyCode===38)rot();
    });
    document.getElementById('l-btn').onclick=()=>move(-1);
    document.getElementById('rg-btn').onclick=()=>move(1);
    document.getElementById('r-btn').onclick=()=>rot();
    document.getElementById('d-btn').onclick=()=>drop();
    reset(); update();
  </script>
</body>
</html>
